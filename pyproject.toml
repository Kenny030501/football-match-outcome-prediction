[project]
name = "football-market-audit"
version = "0.1.0"
description = "Temporal audit of third-party football market probabilities"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "requests>=2.31",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "jupyterlab>=4.2",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive", "notebooks/original-team-notebook.ipynb"]
